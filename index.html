<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Matrícula</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <div class="icono">🎓</div>
    <div>
      <h1>Sistema de Matrícula</h1>
      <p>Registro de estudiantes por ciclo académico</p>
    </div>
  </header>

  <main>
    <section class="tarjeta" id="seccionRegistro">
      <h2>Nueva matrícula</h2>
      <form id="formMatricula">
        <div>
          <label for="nombres">Nombres</label>
          <input type="text" id="nombres" placeholder="Ej: Juan Carlos" required>
        </div>
        <div>
          <label for="apellidos">Apellidos</label>
          <input type="text" id="apellidos" placeholder="Ej: García López" required>
        </div>
        <div>
          <label for="codigo">Código de estudiante</label>
          <input type="text" id="codigo" placeholder="Ej: 2026-0001" required>
        </div>
        <div>
          <label for="dni">DNI</label>
          <input type="text" id="dni" placeholder="8 dígitos" maxlength="8" required>
        </div>
        <div>
          <label for="carrera">Carrera</label>
          <select id="carrera">
            <option>Ingeniería de Sistemas</option>
            <option>Administración</option>
            <option>Contabilidad</option>
            <option>Derecho</option>
            <option>Marketing</option>
            <option>Psicología</option>
            <option>Arquitectura</option>
          </select>
        </div>
        <div>
          <label for="ciclo">Ciclo</label>
          <select id="ciclo">
            <option>I</option><option>II</option><option>III</option>
            <option>IV</option><option>V</option><option>VI</option>
            <option>VII</option><option>VIII</option><option>IX</option><option>X</option>
          </select>
        </div>
        <div class="ancho-completo">
          <label for="curso">Curso a matricular</label>
          <input type="text" id="curso" placeholder="Ej: Algoritmos y Estructuras de Datos" required>
        </div>
        <button type="submit" class="btn-primario">+ Registrar matrícula</button>
      </form>
    </section>

    <section class="tarjeta" id="seccionListado">
      <h2>Estudiantes matriculados</h2>
      <div class="barra-herramientas">
        <span class="contador" id="contador">0</span> registros
      </div>
      <table id="tablaMatriculas">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre completo</th>
            <th>DNI</th>
            <th>Carrera</th>
            <th>Ciclo</th>
            <th>Curso</th>
            <th>Fecha</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
      <p class="sin-datos" id="mensajeVacio">Aún no hay estudiantes matriculados.</p>
    </section>
  </main>

  <footer>Sistema de Matrícula &middot; Proyecto Integrador 2026-II</footer>

  <div id="aviso" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
