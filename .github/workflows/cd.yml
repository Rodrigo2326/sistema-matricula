# Entrega continua del Sistema de Matricula.
#
# Publica la aplicacion en GitHub Pages cada vez que main cambia, pero solo
# despues de que las validaciones del proyecto hayan pasado dentro de esta
# misma ejecucion.
#
# Sobre el disparador: una version anterior se encadenaba al flujo de
# integracion continua mediante workflow_run. Era mas elegante sobre el papel
# -las validaciones no se repetian- pero fallaba de forma intermitente: el paso
# de empaquetado subia el artefacto y el de despliegue no lo encontraba, porque
# la busqueda que hace actions/deploy-pages no resulta fiable cuando la
# ejecucion nace de otro flujo. Cuatro de las ultimas siete ejecuciones
# fallaron por ese motivo (incidencia #48).
#
# Repetir las validaciones cuesta unos quince segundos y elimina el problema de
# raiz, porque el artefacto se sube y se consume en la misma ejecucion. La
# garantia de fondo no cambia: si las validaciones fallan, el despliegue no
# llega a ejecutarse.
name: Entrega continua

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos que necesita el despliegue a Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. Los superados se encolan en lugar de cancelarse, que
# es lo que recomienda GitHub para Pages: cancelar un despliegue en curso puede
# dejarlo a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Validar y publicar en GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar el proyecto antes de publicar
        run: npm run verificar

      - name: Preparar el sitio
        # La aplicacion es estatica: se publica tal cual, sin node_modules ni
        # documentacion interna.
        run: |
          mkdir -p sitio
          cp index.html sitio/
          cp -r css sitio/
          cp -r js sitio/
          echo "Publicado desde $GITHUB_SHA el $(date -u '+%d/%m/%Y %H:%M UTC')" > sitio/VERSION.txt

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4

      - name: Resumen del despliegue
        run: |
          echo "### Despliegue correcto" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.despliegue.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`$GITHUB_SHA\`" >> $GITHUB_STEP_SUMMARY
